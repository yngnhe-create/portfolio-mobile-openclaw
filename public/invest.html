<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>투자커멘드 | 포트폴리오 히트맵</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0a0e1a;--card:#151b2d;--hdr:#1a1f2e;--brd:#2d3748;--txt:#e0e6ed;--sub:#8b9dc3;--red:#ff4757;--grn:#4ecdc4;--blu:#4834d4;--yel:#f9ca24}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans KR',sans-serif;background:var(--bg);color:var(--txt);font-size:14px;padding-bottom:80px;-webkit-font-smoothing:antialiased}
.topbar{background:rgba(26,31,46,.85);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid rgba(72,52,212,.3);padding:14px 16px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:999}
.logo{font-weight:800;font-size:17px;letter-spacing:-.3px}
.logo span{margin-right:6px}
.date-badge{padding:5px 14px;border-radius:20px;font-size:11px;font-weight:600;background:rgba(72,52,212,.12);color:var(--blu);border:1px solid rgba(72,52,212,.25)}
.view-tabs{display:flex;gap:6px;padding:10px 16px;overflow-x:auto;-webkit-overflow-scrolling:touch;background:var(--card);border-bottom:1px solid var(--brd)}
.view-tabs::-webkit-scrollbar{display:none}
.vtab{padding:6px 14px;border-radius:20px;font-size:11px;font-weight:600;white-space:nowrap;background:var(--hdr);color:var(--sub);border:1px solid var(--brd);cursor:pointer;transition:all .2s;-webkit-tap-highlight-color:transparent}
.vtab.active{background:var(--blu);color:#fff;border-color:var(--blu)}
.vtab:active{transform:scale(.96)}
.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--brd);animation:fadeUp .5s ease}
.summary-item{background:var(--card);padding:14px 8px;text-align:center}
.si-val{font-size:18px;font-weight:800;letter-spacing:-1px}
.si-lbl{font-size:10px;color:var(--sub);margin-top:3px;font-weight:600}
.legend{display:flex;align-items:center;gap:6px;padding:10px 16px;font-size:10px;color:var(--sub)}
.legend-bar{height:8px;flex:1;border-radius:4px;background:linear-gradient(90deg,#2ed573,#4ecdc4,#57606f,#ff6b6b,#ff4757)}
.legend-labels{display:flex;justify-content:space-between;font-size:9px;color:var(--sub);padding:0 16px 8px}
.heatmap{padding:8px;min-height:400px}
.hm-sector{margin-bottom:12px}
.hm-sector-name{font-size:11px;font-weight:700;color:var(--sub);padding:4px 8px;margin-bottom:4px;letter-spacing:.5px;text-transform:uppercase}
.hm-grid{display:flex;flex-wrap:wrap;gap:3px}
.hm-cell{border-radius:8px;padding:8px 6px;display:flex;flex-direction:column;justify-content:center;align-items:center;cursor:pointer;transition:all .15s;position:relative;overflow:hidden;border:1px solid rgba(255,255,255,.05)}

.hm-cell .weight{font-size:9px;opacity:.7;margin-top:2px}
.hm-cell.small .name{font-size:9px}

.fetch-bar{text-align:center;padding:4px;font-size:10px;color:var(--sub);background:var(--card);border-bottom:1px solid var(--brd)}
/* Flat view */
.hm-flat{display:flex;flex-wrap:wrap;gap:3px;padding:8px}
/* Detail modal */
.modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.6);backdrop-filter:blur(4px);z-index:1000;display:none;align-items:flex-end;justify-content:center}

@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}

.modal-name{font-size:20px;font-weight:800;margin-bottom:4px;letter-spacing:-.5px}

.modal-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
.mg-item{background:var(--hdr);border-radius:12px;padding:12px;text-align:center}
.mg-val{font-size:18px;font-weight:800;margin-bottom:2px}
.mg-lbl{font-size:10px;color:var(--sub);font-weight:600}
.modal-bar{height:8px;background:var(--brd);border-radius:4px;overflow:hidden;margin-bottom:16px}
.modal-bar-fill{height:100%;border-radius:4px;transition:width .6s ease}
.modal-info{font-size:12px;color:var(--sub);line-height:1.8}
.modal-info strong{color:var(--txt)}
.modal-close{display:block;width:100%;padding:14px;border:none;border-radius:14px;background:var(--hdr);color:var(--txt);font-size:14px;font-weight:700;cursor:pointer;margin-top:16px;-webkit-tap-highlight-color:transparent}
.modal-close:active{transform:scale(.98)}
/* Sector summary */
.sec-summary{padding:8px 16px}
.ss-card{background:var(--card);border-radius:14px;padding:14px;margin-bottom:8px;border:1px solid rgba(45,55,72,.5)}
.ss-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.ss-name{font-size:14px;font-weight:700}
.ss-pct{font-size:14px;font-weight:800}
.ss-bar{height:6px;background:var(--brd);border-radius:3px;overflow:hidden;margin-bottom:8px}
.ss-bar-fill{height:100%;border-radius:3px}
.ss-stocks{font-size:11px;color:var(--sub);line-height:1.6}
/* Mask */
.mask-btn{position:fixed;top:12px;right:12px;z-index:9999;background:rgba(72,52,212,.9);color:#fff;border:none;border-radius:20px;padding:6px 14px;font-size:12px;font-weight:700;cursor:pointer;backdrop-filter:blur(4px);box-shadow:0 2px 8px rgba(0,0,0,.4);transition:all .2s;-webkit-tap-highlight-color:transparent}
body.masked .si-val,body.masked .hm-cell .pct,body.masked .hm-cell .weight,body.masked .mg-val,body.masked .ss-pct{filter:blur(8px);user-select:none}
/* Loading */
.loading{text-align:center;padding:60px 20px;color:var(--sub)}
.loading .spin{display:inline-block;width:28px;height:28px;border:3px solid var(--brd);border-top-color:var(--blu);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
.bnav{position:fixed;bottom:0;left:0;right:0;background:rgba(26,31,46,.92);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid rgba(45,55,72,.5);display:flex;justify-content:space-around;padding:8px 0 max(20px,env(safe-area-inset-bottom));z-index:999}
.bnav a{display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--sub);text-decoration:none;font-size:10px;padding:5px 10px;-webkit-tap-highlight-color:transparent}
.bnav a.on{color:var(--blu)}
.bnav .ni{font-size:22px}
.scroll-top{position:fixed;bottom:80px;right:16px;width:44px;height:44px;border-radius:50%;background:rgba(72,52,212,.9);backdrop-filter:blur(8px);color:#fff;border:1px solid rgba(72,52,212,.4);font-size:18px;cursor:pointer;display:none;z-index:998;box-shadow:0 4px 16px rgba(0,0,0,.3);transition:all .2s}
.scroll-top:active{transform:scale(.9)}
.fab-refresh{position:fixed;bottom:78px;left:16px;width:48px;height:48px;border-radius:50%;background:linear-gradient(135deg,var(--blu),#686de0);color:#fff;border:none;font-size:20px;cursor:pointer;z-index:1000;box-shadow:0 4px 14px rgba(72,52,212,.4);display:flex;align-items:center;justify-content:center;transition:transform .2s;-webkit-tap-highlight-color:transparent}
.fab-refresh:active{transform:scale(.9)}
.fab-refresh.spin .fab-icon{animation:fabspin .8s linear infinite}
@keyframes fabspin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
</style>

<script>
// ═══════════════════════════════════════
// CSV Parser
// ═══════════════════════════════════════
function parseCSV(text) {
  const lines = text.trim().split('\n');
  if (lines.length < 2) return [];
  const assets = [];
  for (let i = 1; i < lines.length; i++) {
    const row = parseRow(lines[i]);
    if (!row || row.length < 7 || !row[0].trim()) continue;
    const name = row[0].trim();
    const category = row[1].trim();
    const quantity = pNum(row[2]);
    const rawVal = row[3].trim();
    const currency = rawVal.startsWith('$') ? 'USD' : 'KRW';
    const totalValue = pNum(rawVal);
    const buyPrice = pNum(row[4]);
    const currentPrice = pNum(row[5]);
    const plStr = row[6] || '';
    const pctM = plStr.match(/\(([\+\-]?[\d\.]+)%\)/);
    const gainPct = pctM ? parseFloat(pctM[1]) : 0;
    const divMonths = row[7] ? row[7].trim() : '-';
    const divYield = row[8] ? row[8].trim() : '-';
    assets.push({ name, category, quantity, totalValue, currency, buyPrice, currentPrice, gainPct, divMonths, divYield });
  }
  return assets;
}
function parseRow(line) {
  const r = []; let c = '', q = false;
  for (let i = 0; i < line.length; i++) {
    const ch = line[i];
    if (ch === '"') q = !q;
    else if (ch === ',' && !q) { r.push(c); c = ''; }
    else c += ch;
  }
  r.push(c); return r;
}
function pNum(s) {
  if (!s || s === '-') return 0;
  return parseFloat(String(s).replace(/[₩$,\s+]/g, '')) || 0;
}

// ═══════════════════════════════════════
// Color Engine
// ═══════════════════════════════════════
function getTotalColor(pct) {
  // Korean: red = gain, green = loss — for total return scale (-30% to +100%)
  if (pct >= 100) return 'rgba(255,55,67,.85)';
  if (pct >= 50) return `rgba(255,${Math.round(55 + (107-55)*(100-pct)/50)},${Math.round(67 + (107-67)*(100-pct)/50)},.75)`;
  if (pct >= 20) return `rgba(255,${Math.round(107 + (130-107)*(50-pct)/30)},${Math.round(107 + (130-107)*(50-pct)/30)},.65)`;
  if (pct >= 0) return `rgba(${Math.round(180 + 75*pct/20)},${Math.round(150 - 20*pct/20)},${Math.round(150 - 43*pct/20)},.5)`;
  if (pct >= -15) return `rgba(${Math.round(100 + 80*(15+pct)/15)},${Math.round(180 + 25*(15+pct)/15)},${Math.round(180 + 16*(15+pct)/15)},.55)`;
  if (pct >= -30) return `rgba(78,205,196,.65)`;
  return 'rgba(46,213,115,.75)';
}
function getDailyColor(pct) {
  // Daily change scale: -5% to +5% (amplified for visibility)
  if (pct >= 5) return 'rgba(255,55,67,.85)';
  if (pct >= 3) return `rgba(255,${Math.round(55+(107-55)*(5-pct)/2)},${Math.round(67+(107-67)*(5-pct)/2)},.75)`;
  if (pct >= 1) return `rgba(255,${Math.round(107+(150-107)*(3-pct)/2)},${Math.round(107+(140-107)*(3-pct)/2)},.6)`;
  if (pct >= 0) return `rgba(${Math.round(200+55*pct)},${Math.round(160-10*pct)},${Math.round(155-48*pct)},.45)`;
  if (pct >= -1) return `rgba(${Math.round(160+40*(1+pct))},${Math.round(190+15*(1+pct))},${Math.round(188+8*(1+pct))},.45)`;
  if (pct >= -3) return `rgba(${Math.round(100+60*(3+pct)/2)},${Math.round(190)},${Math.round(190)},.6)`;
  if (pct >= -5) return 'rgba(78,205,196,.7)';
  return 'rgba(46,213,115,.8)';
}
function getColor(pct) {
  return displayMode === 'daily' ? getDailyColor(pct) : getTotalColor(pct);
}

// ═══════════════════════════════════════
// Data & State
// ═══════════════════════════════════════
let ASSETS = [];
let USDKRW = 1450;
let currentView = 'sector';
let displayMode = 'daily'; // 'daily' or 'total'
const dailyChgMap = {};

const PROXY = url => `https://api.allorigins.win/get?url=${encodeURIComponent(url)}`;

const TICKER_MAP = {
  // US Stocks
  'INTC':'INTC','NVDA':'NVDA','TSLA':'TSLA','AMD':'AMD','AMZN':'AMZN',
  'LLY':'LLY','MSFT':'MSFT','GOOGL':'GOOGL','RTX':'RTX','PLTR':'PLTR',
  'ARTY':'ARTY','HSAI':'HSAI',
  // US ETFs
  'NLR':'NLR','GRID ETF':'GRID',
  // Crypto
  'BTC/KRW':'BTC-KRW','ETH/KRW':'ETH-KRW','SOL/KRW':'SOL-KRW','LINK/USD':'LINK-USD',
  // Korean individual stocks
  '삼성전자':'005930.KS','삼성전자우':'005935.KS','파마리서치':'214150.KQ',
  '현대차3우B':'005387.KS','DL이앤씨우':'375500.KS','두산':'000150.KS',
  '네이버':'035420.KS','엘오티베큠':'083310.KQ','현대건설':'000720.KS',
  '현대차우':'005385.KS','삼성SDI':'006400.KS','세아베스틸지주':'001430.KS',
  'LG에너지솔루션':'373220.KS','샤오미':'1810.HK',
  // Korean REITs
  'ESR켄달스퀘어리츠':'365550.KS','코람코라이프인프라리츠':'357120.KS',
  'SK리츠':'395400.KS','신한서부티엔디리츠':'404990.KS','이지스밸류플러스리츠':'334890.KS',
  // Korean ETFs (known codes)
  'KODEX 증권':'102970.KS','TIGER 코스피고배당':'161510.KS',
  'TIGER 미국테크TOP10 INDXX':'381170.KS','KODEX TRF3070':'294400.KS',
};

function getKRW(a) {
  return a.currency === 'USD' ? a.totalValue * USDKRW : a.totalValue;
}

// ═══════════════════════════════════════
// Renderers
// ═══════════════════════════════════════
function fmtKRW(v) {
  const abs = Math.abs(v);
  if (abs >= 1e8) return (v < 0 ? '-' : '') + '₩' + (abs/1e8).toFixed(1) + '억';
  if (abs >= 1e4) return (v < 0 ? '-' : '') + '₩' + (abs/1e4).toFixed(0) + '만';
  return '₩' + Math.round(v).toLocaleString('ko-KR');
}

function renderSummary() {
  let total = 0, pl = 0, up = 0, dn = 0;
  ASSETS.forEach(a => {
    if (a.category === '현금') return;
    const v = getKRW(a);
    total += v;
    if (displayMode === 'daily') {
      const dc = dailyChgMap[a.name];
      if (dc) {
        if (dc.pct > 0) up++; else if (dc.pct < 0) dn++;
        pl += v * dc.pct / 100;
      }
    } else {
      if (a.gainPct > 0) up++; else if (a.gainPct < 0) dn++;
      const cost = v / (1 + a.gainPct/100);
      pl += v - cost;
    }
  });
  document.getElementById('smTotal').textContent = fmtKRW(total);
  const plLabel = displayMode === 'daily' ? '당일 손익' : '평가손익';
  document.getElementById('smPL').textContent = (pl >= 0 ? '+' : '') + fmtKRW(pl);
  document.getElementById('smPL').style.color = pl >= 0 ? 'var(--red)' : 'var(--grn)';
  document.getElementById('smPL').parentElement.querySelector('.si-lbl').textContent = plLabel;
  document.getElementById('smUp').textContent = up + '개';
  document.getElementById('smDn').textContent = dn + '개';
}

function calcWeights() {
  let total = 0;
  const items = ASSETS.filter(a => a.category !== '현금').map(a => {
    const v = getKRW(a);
    total += v;
    return { ...a, valKRW: v };
  });
  return items.map(a => ({ ...a, weight: (a.valKRW / total) * 100 })).sort((a,b) => b.valKRW - a.valKRW);
}

function cellSize(weight) {
  // Map weight to pixel size. Total area ~= screen
  const w = window.innerWidth - 16;
  const area = w * 500; // approximate area
  const cellArea = area * weight / 100;
  const side = Math.sqrt(cellArea);
  const minW = 55, maxW = w - 6;
  return Math.max(minW, Math.min(maxW, Math.round(side)));
}

function getDisplayPct(a) {
  if (displayMode === 'daily') {
    const dc = dailyChgMap[a.name];
    if (dc) return { pct: dc.pct, live: true };
    return { pct: 0, live: false }; // no data yet
  }
  return { pct: a.gainPct, live: true };
}

function createCell(a) {
  const size = cellSize(a.weight);
  const isSmall = size < 80;
  const isTiny = size < 62;
  const el = document.createElement('div');
  el.className = 'hm-cell' + (isTiny ? ' tiny' : isSmall ? ' small' : '');
  el.style.width = size + 'px';
  el.style.height = Math.max(50, Math.round(size * 0.65)) + 'px';
  const dp = getDisplayPct(a);
  el.style.background = dp.live ? getColor(dp.pct) : 'rgba(87,96,111,.4)';
  el.style.flexGrow = Math.max(1, Math.round(a.weight * 2));
  const sign = dp.pct >= 0 ? '+' : '';
  const pctStr = dp.live ? `${sign}${dp.pct.toFixed(1)}%` : '···';
  el.innerHTML = `<div class="name">${a.name}</div><div class="pct">${pctStr}</div><div class="weight">${a.weight.toFixed(1)}%</div>`;
  el.onclick = () => openModal(a);
  return el;
}

function renderSectorView() {
  const items = calcWeights();
  const sectors = {};
  items.forEach(a => {
    if (!sectors[a.category]) sectors[a.category] = [];
    sectors[a.category].push(a);
  });
  // Sort sectors by total weight
  const sorted = Object.entries(sectors).sort((a,b) => {
    const wa = a[1].reduce((s,x) => s + x.weight, 0);
    const wb = b[1].reduce((s,x) => s + x.weight, 0);
    return wb - wa;
  });

  const container = document.getElementById('content');
  container.innerHTML = '';
  sorted.forEach(([name, stocks]) => {
    const sec = document.createElement('div');
    sec.className = 'hm-sector';
    const totalW = stocks.reduce((s,x) => s + x.weight, 0);
    sec.innerHTML = `<div class="hm-sector-name">${name} · ${totalW.toFixed(1)}%</div>`;
    const grid = document.createElement('div');
    grid.className = 'hm-grid';
    stocks.forEach(a => grid.appendChild(createCell(a)));
    sec.appendChild(grid);
    container.appendChild(sec);
  });
}

function renderFlatView() {
  const items = calcWeights();
  const container = document.getElementById('content');
  container.innerHTML = '';
  const grid = document.createElement('div');
  grid.className = 'hm-flat';
  items.forEach(a => grid.appendChild(createCell(a)));
  container.appendChild(grid);
}

function renderGainView() {
  const items = calcWeights().map(a => ({...a, dispPct: getDisplayPct(a).pct, dispLive: getDisplayPct(a).live}))
    .sort((a,b) => b.dispPct - a.dispPct);
  const container = document.getElementById('content');
  container.innerHTML = '';
  // Winners
  const winners = items.filter(a => a.dispPct >= 0);
  const losers = items.filter(a => a.dispPct < 0);
  if (winners.length) {
    const sec = document.createElement('div');
    sec.className = 'hm-sector';
    sec.innerHTML = `<div class="hm-sector-name" style="color:var(--red)">수익 종목 · ${winners.length}개</div>`;
    const grid = document.createElement('div');
    grid.className = 'hm-grid';
    winners.forEach(a => grid.appendChild(createCell(a)));
    sec.appendChild(grid);
    container.appendChild(sec);
  }
  if (losers.length) {
    const sec = document.createElement('div');
    sec.className = 'hm-sector';
    sec.innerHTML = `<div class="hm-sector-name" style="color:var(--grn)">손실 종목 · ${losers.length}개</div>`;
    const grid = document.createElement('div');
    grid.className = 'hm-grid';
    losers.forEach(a => grid.appendChild(createCell(a)));
    sec.appendChild(grid);
    container.appendChild(sec);
  }
}

function renderSummaryView() {
  const items = calcWeights();
  const sectors = {};
  items.forEach(a => {
    if (!sectors[a.category]) sectors[a.category] = { totalVal: 0, totalWeight: 0, stocks: [], gainSum: 0, count: 0 };
    const s = sectors[a.category];
    const dp = getDisplayPct(a);
    const pct = dp.live ? dp.pct : a.gainPct;
    s.totalVal += a.valKRW;
    s.totalWeight += a.weight;
    s.stocks.push({...a, dispPct: pct});
    s.gainSum += pct * a.weight;
    s.count++;
  });

  const sorted = Object.entries(sectors)
    .map(([name, s]) => ({ name, ...s, avgGain: s.gainSum / s.totalWeight }))
    .sort((a,b) => b.totalWeight - a.totalWeight);

  const container = document.getElementById('content');
  container.innerHTML = '<div class="sec-summary"></div>';
  const wrap = container.querySelector('.sec-summary');

  sorted.forEach(s => {
    const sign = s.avgGain >= 0 ? '+' : '';
    const col = s.avgGain >= 0 ? 'var(--red)' : 'var(--grn)';
    const topStocks = s.stocks.sort((a,b) => b.valKRW - a.valKRW).slice(0, 5);
    const stocksHtml = topStocks.map(a => {
      const sc = a.dispPct >= 0 ? 'var(--red)' : 'var(--grn)';
      const ss = a.dispPct >= 0 ? '+' : '';
      return `<strong>${a.name}</strong> ${fmtKRW(a.valKRW)} <span style="color:${sc}">${ss}${a.dispPct.toFixed(1)}%</span>`;
    }).join(' · ');

    const card = document.createElement('div');
    card.className = 'ss-card';
    card.innerHTML = `
      <div class="ss-header">
        <div class="ss-name">${s.name} <span style="font-size:11px;color:var(--sub);font-weight:400">${s.count}개</span></div>
        <div class="ss-pct" style="color:${col}">${sign}${s.avgGain.toFixed(1)}%</div>
      </div>
      <div class="ss-bar"><div class="ss-bar-fill" style="width:${s.totalWeight}%;background:${getColor(s.avgGain)}"></div></div>
      <div style="display:flex;justify-content:space-between;margin-bottom:8px">
        <span style="font-size:12px;font-weight:700">${fmtKRW(s.totalVal)}</span>
        <span style="font-size:12px;color:var(--sub)">${s.totalWeight.toFixed(1)}%</span>
      </div>
      <div class="ss-stocks">${stocksHtml}</div>
    `;
    wrap.appendChild(card);
  });
}

// ═══════════════════════════════════════
// Modal
// ═══════════════════════════════════════
function openModal(a) {
  const m = document.getElementById('modal');
  document.getElementById('mdName').textContent = a.name;
  document.getElementById('mdCat').textContent = `${a.category} · ${a.quantity % 1 === 0 ? a.quantity.toLocaleString() : a.quantity.toFixed(3)}${a.category === '가상자산' ? '개' : '주'}`;

  const valStr = a.currency === 'USD' ? '$' + a.totalValue.toLocaleString() : fmtKRW(a.totalValue);
  document.getElementById('mdValue').textContent = valStr;

  const dp = getDisplayPct(a);
  const showPct = dp.live ? dp.pct : a.gainPct;
  const sign = showPct >= 0 ? '+' : '';
  document.getElementById('mdPct').textContent = sign + showPct.toFixed(2) + '%';
  document.getElementById('mdPct').style.color = showPct >= 0 ? 'var(--red)' : 'var(--grn)';
  document.getElementById('mdPct').parentElement.querySelector('.mg-lbl').textContent = displayMode === 'daily' ? '당일 등락' : '수익률';

  const buyStr = a.buyPrice === 0 ? '-' : (a.currency === 'USD' ? '$' + a.buyPrice.toLocaleString() : '₩' + a.buyPrice.toLocaleString());
  const curStr = a.currentPrice === 0 ? '-' : (a.currency === 'USD' ? '$' + a.currentPrice.toLocaleString() : '₩' + a.currentPrice.toLocaleString());
  document.getElementById('mdBuy').textContent = buyStr;
  document.getElementById('mdCur').textContent = curStr;

  const bar = document.getElementById('mdBar');
  bar.style.width = a.weight.toFixed(1) + '%';
  bar.style.background = getColor(a.gainPct);

  let info = `<strong>포트폴리오 비중:</strong> ${a.weight.toFixed(2)}%<br>`;
  info += `<strong>자산가치 (KRW):</strong> ${fmtKRW(getKRW(a))}<br>`;
  const dc = dailyChgMap[a.name];
  if (dc) {
    const ds = dc.pct >= 0 ? '+' : '';
    const dcol = dc.pct >= 0 ? 'var(--red)' : 'var(--grn)';
    info += `<strong>당일 등락:</strong> <span style="color:${dcol};font-weight:700">${ds}${dc.pct.toFixed(2)}%</span><br>`;
  }
  info += `<strong>총수익률:</strong> <span style="color:${a.gainPct>=0?'var(--red)':'var(--grn)'};font-weight:700">${a.gainPct>=0?'+':''}${a.gainPct.toFixed(2)}%</span><br>`;
  if (a.divMonths !== '-') info += `<strong>배당월:</strong> ${a.divMonths}<br>`;
  if (a.divYield !== '-') info += `<strong>투자배당률:</strong> ${a.divYield}<br>`;
  if (a.gainPct > 100) info += `<br><span style="color:var(--red);font-weight:700">고수익 종목 — 일부 익실 검토</span>`;
  if (a.gainPct < -20) info += `<br><span style="color:var(--grn);font-weight:700">손절 라인 도달 — 재검토 필요</span>`;
  document.getElementById('mdInfo').innerHTML = info;

  m.classList.add('show');
  document.body.style.overflow = 'hidden';
}

function closeModal(e) {
  if (e && e.target !== document.getElementById('modal')) return;
  document.getElementById('modal').classList.remove('show');
  document.body.style.overflow = '';
}

// ═══════════════════════════════════════
// View Toggle
// ═══════════════════════════════════════
function setView(v) {
  currentView = v;
  document.querySelectorAll('.vtab').forEach(t => t.classList.toggle('active', t.textContent.includes(
    v === 'sector' ? '섹터별' : v === 'flat' ? '전체' : v === 'gain' ? '수익률' : '요약'
  )));
  render();
}

function render() {
  if (currentView === 'sector') renderSectorView();
  else if (currentView === 'flat') renderFlatView();
  else if (currentView === 'gain') renderGainView();
  else renderSummaryView();
}

// ═══════════════════════════════════════
// Market Data (for USD/KRW)
// ═══════════════════════════════════════
async function fetchUSDKRW() {
  try {
    const res = await fetch('data/market_latest.json');
    if (res.ok) {
      const mkt = await res.json();
      const fx = mkt.data && mkt.data.find(d => d.id === 'USDKRW');
      if (fx && fx.cur > 0) { USDKRW = fx.cur; return; }
    }
  } catch(e) {}
  try {
    const r = await fetch('https://query1.finance.yahoo.com/v8/finance/chart/KRW=X?interval=1d&range=1d');
    const d = await r.json();
    const cur = d.chart.result[0].meta.regularMarketPrice;
    if (cur > 0) USDKRW = cur;
  } catch(e) { /* fallback 1450 */ }
}

// ═══════════════════════════════════════
// Daily Change Fetcher
// ═══════════════════════════════════════
async function fetchOneTicker(name, sym) {
  try {
    const url = `https://query1.finance.yahoo.com/v8/finance/chart/${encodeURIComponent(sym)}?interval=1d&range=1d`;
    const resp = await fetch(PROXY(url));
    const json = await resp.json();
    const d = JSON.parse(json.contents);
    const meta = d.chart.result[0].meta;
    const cur = meta.regularMarketPrice || 0;
    const prev = meta.chartPreviousClose || meta.previousClose || cur;
    if (prev > 0) dailyChgMap[name] = { pct: (cur-prev)/prev*100, cur, prev };
  } catch(e) { /* skip */ }
}

async function fetchDailyChanges() {
  const bar = document.getElementById('fetchBar');
  bar.style.display = 'block';
  const entries = Object.entries(TICKER_MAP);
  let done = 0;
  bar.textContent = `실시간 시세 로딩 중... (0/${entries.length})`;

  // Concurrency-limited parallel fetch
  const concurrency = 8;
  let idx = 0;
  async function worker() {
    while (idx < entries.length) {
      const i = idx++;
      const [name, sym] = entries[i];
      await fetchOneTicker(name, sym);
      done++;
      bar.textContent = `실시간 시세 로딩 중... (${done}/${entries.length})`;
    }
  }
  await Promise.all(Array(Math.min(concurrency, entries.length)).fill(0).map(() => worker()));

  bar.textContent = `실시간 데이터 ${done}/${entries.length} 로드 완료`;
  setTimeout(() => { bar.style.display = 'none'; }, 2000);

  // Re-render with live data
  renderSummary();
  render();
}

function setMode(mode) {
  displayMode = mode;
  document.getElementById('mpDaily').classList.toggle('on', mode === 'daily');
  document.getElementById('mpTotal').classList.toggle('on', mode === 'total');
  const labels = document.getElementById('legendLabels');
  if (mode === 'daily') {
    labels.innerHTML = '<span>-5%</span><span>-2%</span><span>0%</span><span>+2%</span><span>+5%+</span>';
  } else {
    labels.innerHTML = '<span>-30%</span><span>-15%</span><span>0%</span><span>+50%</span><span>+100%+</span>';
  }
  renderSummary();
  render();
}

// ═══════════════════════════════════════
// Init
// ═══════════════════════════════════════
function toggleMask() {
  const on = document.body.classList.toggle('masked');
  document.getElementById('maskBtn').textContent = on ? '👁 해제' : '🙈 마스킹';
  localStorage.setItem('mask', on ? '1' : '0');
}
if (localStorage.getItem('mask') === '1') {
  document.body.classList.add('masked');
  document.getElementById('maskBtn').textContent = '👁 해제';
}

document.getElementById('dateLabel').textContent = new Date().toLocaleDateString('ko-KR', {year:'numeric',month:'2-digit',day:'2-digit'}).replace(/\. /g,'.').replace('.','');

async function init() {
  await fetchUSDKRW();
  try {
    const resp = await fetch('portfolio_full.csv');
    const text = await resp.text();
    ASSETS = parseCSV(text);
  } catch(e) {
    document.getElementById('content').innerHTML = '<div class="loading" style="color:var(--red)">CSV 파일을 불러올 수 없습니다.</div>';
    return;
  }
  if (ASSETS.length === 0) {
    document.getElementById('content').innerHTML = '<div class="loading">포트폴리오 데이터가 비어있습니다.</div>';
    return;
  }
  renderSummary();
  render();
  // Fetch daily changes in background (non-blocking)
  fetchDailyChanges();
}
init();

window.addEventListener('scroll', () => {
  document.getElementById('scrollTopBtn').style.display = window.scrollY > 300 ? 'block' : 'none';
}, {passive: true});

// Close modal on back button
window.addEventListener('popstate', () => {
  document.getElementById('modal').classList.remove('show');
  document.body.style.overflow = '';
});
</script>
<button class="fab-refresh" id="refreshBtn" onclick="doRefresh()" title="전체 새로고침"><span class="fab-icon">↻</span></button>
<script>
async function doRefresh(){
  const btn=document.getElementById('refreshBtn');
  btn.classList.add('spin');
  try{
    // Re-fetch USD/KRW live
    await fetchUSDKRW();
    // Re-fetch daily changes
    await fetchDailyChanges();
    renderSummary();
    render();
  }catch(e){}
  btn.classList.remove('spin');
}
</script>
