<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>투자커멘드 | 플레이북</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0a0e1a;--card:#151b2d;--hdr:#1a1f2e;--brd:#2d3748;--txt:#e0e6ed;--sub:#8b9dc3;--red:#ff4757;--grn:#4ecdc4;--blu:#4834d4;--yel:#f9ca24}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans KR',sans-serif;background:var(--bg);color:var(--txt);font-size:14px;padding-bottom:80px}
.hdr{background:var(--hdr);padding:15px;border-bottom:1px solid var(--brd);position:sticky;top:0;z-index:999}
.hdr-ttl{font-size:18px;font-weight:800;margin-bottom:4px}
.upd{font-size:11px;color:var(--sub)}
.tcard{background:linear-gradient(135deg,var(--blu),#686de0);padding:20px;margin:15px;border-radius:14px}
.sec{background:var(--card);margin:0 15px 15px;padding:18px;border-radius:12px}
.sec-ttl{font-size:15px;font-weight:700;margin-bottom:14px}
.metric-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:0 15px 15px}
.metric{background:var(--card);padding:15px;border-radius:12px;text-align:center}
.metric-val{font-size:22px;font-weight:800;margin-bottom:4px}
.metric-lbl{font-size:11px;color:var(--sub)}
.sector-table{width:100%;border-collapse:collapse}
.sector-table th{text-align:left;padding:8px;font-size:11px;color:var(--sub);border-bottom:1px solid var(--brd)}
.principle{background:var(--hdr);border-left:4px solid var(--blu);border-radius:8px;padding:14px;margin-bottom:10px}
.p-num{font-size:22px;font-weight:900;color:var(--blu);margin-bottom:4px}
.p-ttl{font-size:14px;font-weight:700;margin-bottom:4px}
.p-desc{font-size:12px;color:var(--sub)}
.bnav{position:fixed;bottom:0;left:0;right:0;background:var(--hdr);border-top:1px solid var(--brd);display:flex;justify-content:space-around;padding:8px 0 20px;z-index:999}
.bnav a{display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--sub);text-decoration:none;font-size:10px;padding:5px 10px}
.bnav a.on{color:var(--blu)}.ni{font-size:22px}
.fab-refresh{position:fixed;bottom:78px;left:16px;width:48px;height:48px;border-radius:50%;background:linear-gradient(135deg,var(--blu),#686de0);color:#fff;border:none;font-size:20px;cursor:pointer;z-index:1000;box-shadow:0 4px 14px rgba(72,52,212,.4);display:flex;align-items:center;justify-content:center;transition:transform .2s;-webkit-tap-highlight-color:transparent}
.fab-refresh:active{transform:scale(.9)}
.fab-refresh.spin .fab-icon{animation:fabspin .8s linear infinite}
@keyframes fabspin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
.loading{text-align:center;padding:40px;color:var(--sub);font-size:13px}
</style>
</head>
<body>
<div class="hdr">
  <div class="hdr-ttl">📖 플레이북</div>
  <div class="upd" id="updTime">⏱ 로딩 중...</div>
</div>

<div id="content"><div class="loading">데이터 로딩 중...</div></div>

<nav class="bnav">
  <a href="index.html"><span class="ni">📊</span>대시보드</a>
  <a href="invest.html"><span class="ni">🗺️</span>히트맵</a>
  <a href="report.html"><span class="ni">📋</span>리포트</a>
  <a href="playbook.html" class="on"><span class="ni">📖</span>플레이북</a>
</nav>
<button class="fab-refresh" id="refreshBtn" onclick="doRefresh()" title="전체 새로고침"><span class="fab-icon">↻</span></button>

<script>
function doRefresh(){document.getElementById('refreshBtn').classList.add('spin');setTimeout(()=>location.reload(),300)}

/* ── CSV 파서 ── */
function parseCSVLine(line){
  const r=[];let cur='',inQ=false;
  for(let i=0;i<line.length;i++){const ch=line[i];if(ch==='"')inQ=!inQ;else if(ch===','&&!inQ){r.push(cur.trim());cur='';}else cur+=ch;}
  r.push(cur.trim());return r;
}
function parseCSV(text){
  const lines=text.trim().split('\n').filter(l=>l.trim());
  const hdrs=parseCSVLine(lines[0]);
  return lines.slice(1).map(line=>{const vals=parseCSVLine(line);const obj={};hdrs.forEach((h,i)=>obj[h]=vals[i]||'');return obj;});
}
function parseMoney(str){
  if(!str||str==='-')return{val:0,usd:false};
  const usd=str.includes('$');
  const n=parseFloat(str.replace(/[₩$,+\s]/g,''));
  return{val:isNaN(n)?0:Math.abs(n),usd};
}
function parsePnlPct(str){
  if(!str||str==='-')return 0;
  const m=str.match(/([+-]?\d+\.?\d*)%/);
  return m?parseFloat(m[1]):0;
}
function fmtKRW(v){
  if(v>=1e8)return'₩'+(v/1e8).toFixed(1)+'억';
  if(v>=1e4)return'₩'+Math.round(v/1e4)+'만';
  return'₩'+v.toLocaleString('ko-KR',{maximumFractionDigits:0});
}

/* ── 데이터 로드 & 분석 ── */
let usdkrw=1400;

async function fetchUSDKRW(){
  try{
    const r=await fetch('data/market_latest.json');
    if(r.ok){const mkt=await r.json();const fx=mkt.data&&mkt.data.find(d=>d.id==='USDKRW');if(fx)usdkrw=parseFloat(fx.price.replace(/,/g,''))||1400;}
  }catch(e){}
}

async function loadAndRender(){
  await fetchUSDKRW();
  const res=await fetch('portfolio_full.csv');
  const text=await res.text();
  const rows=parseCSV(text);

  /* ── 분석 ── */
  let totalVal=0,totalCost=0;
  const sectorMap={};
  const losers=[];
  const gainers=[];
  const dividends=[];
  let stockCount=0;

  rows.forEach(row=>{
    const name=row['자산']||'';
    const cat=row['분류']||'기타';
    const qty=parseFloat(row['수량'])||0;
    const av=parseMoney(row['자산가치']);
    const cp=parseMoney(row['매수가']);
    const pct=parsePnlPct(row['손익']);

    let valKRW=av.usd?av.val*usdkrw:av.val;
    let costKRW=cp.val>0?(cp.usd?cp.val*usdkrw*qty:cp.val*qty):0;

    if(cat==='현금')return; // 현금 제외

    stockCount++;
    totalVal+=valKRW;
    totalCost+=costKRW;
    sectorMap[cat]=(sectorMap[cat]||0)+valKRW;

    if(pct>50)gainers.push({name,pct,val:valKRW});
    if(pct<-10)losers.push({name,pct,val:valKRW});

    // 배당
    const dm=row['배당월']||'';
    const dy=row['투자배당률']||'';
    if(dm&&dm!=='-'){
      dividends.push({name,month:dm,yield:dy.substring(0,25)});
    }
  });

  const totalProfit=totalVal-totalCost;
  const totalPct=totalCost>0?(totalProfit/totalCost*100):0;

  // 섹터 정렬
  const sectors=Object.entries(sectorMap).sort((a,b)=>b[1]-a[1]).map(([cat,val])=>({cat,val,pct:totalVal>0?val/totalVal*100:0}));

  // 리스크 항목
  const risks=[];
  // 단일 종목 집중도
  gainers.sort((a,b)=>b.pct-a.pct);
  gainers.slice(0,5).forEach(g=>{
    const w=totalVal>0?g.val/totalVal*100:0;
    if(w>10)risks.push({level:'medium',icon:'🟡',title:g.name+' 집중도',desc:'단일 종목 비중 '+w.toFixed(1)+'% — 부분 익실 또는 스탑로스 설정'});
  });
  // 손실 종목
  losers.sort((a,b)=>a.pct-b.pct);
  losers.slice(0,3).forEach(l=>{
    risks.push({level:'medium',icon:'⚠️',title:l.name+' 손실',desc:'현재 '+l.pct.toFixed(1)+'% 손실 중 — 손절 기준 재검토'});
  });

  // 전략 추천
  const recs=[];
  if(totalPct>20)recs.push({icon:'💰',priority:'즉시',pColor:'#ff4757',title:'연간 목표 초과 달성 (+'+totalPct.toFixed(1)+'%)',desc:'수익의 10~15% 현금화 검토. 리밸런싱으로 리스크 관리.'});
  recs.push({icon:'⚖️',priority:'1개월 내',pColor:'#f9ca24',title:'섹터 리밸런싱',desc:'가상자산 비중 축소 → 채권/배당주 비중 확대 (안정성 강화)'});
  recs.push({icon:'📈',priority:'모니터링',pColor:'#4ecdc4',title:'신규 매수 종목 관리',desc:'현대차: 단기 하락 구간 분할 매수 전략 유지. 목표 수익률 +15%'});

  /* ── 렌더링 ── */
  const sign=totalProfit>=0?'+':'';
  const now=new Date();
  const ts=now.getFullYear()+'년 '+String(now.getMonth()+1).padStart(2,'0')+'월 '+String(now.getDate()).padStart(2,'0')+'일 '+String(now.getHours()).padStart(2,'0')+':'+String(now.getMinutes()).padStart(2,'0')+' KST';
  document.getElementById('updTime').textContent='⏱ 분석: '+ts;

  let html='';

  // 종합 현황 카드
  html+='<div class="tcard">';
  html+='<div style="font-size:12px;opacity:.8;margin-bottom:4px">포트폴리오 종합 현황</div>';
  html+='<div style="font-size:32px;font-weight:800;margin-bottom:4px">'+fmtKRW(totalVal)+'</div>';
  html+='<div style="font-size:14px;font-weight:700">'+sign+totalPct.toFixed(1)+'% · '+sign+fmtKRW(Math.abs(totalProfit))+'</div>';
  html+='</div>';

  // 메트릭 그리드
  html+='<div class="metric-grid">';
  html+='<div class="metric"><div class="metric-val">'+stockCount+'</div><div class="metric-lbl">보유종목</div></div>';
  html+='<div class="metric"><div class="metric-val">'+risks.length+'</div><div class="metric-lbl">리스크 항목</div></div>';
  html+='<div class="metric"><div class="metric-val">'+dividends.length+'</div><div class="metric-lbl">배당종목</div></div>';
  html+='<div class="metric"><div class="metric-val">'+sectors.length+'</div><div class="metric-lbl">투자섹터</div></div>';
  html+='</div>';

  // 리스크 경고
  html+='<div class="sec"><div class="sec-ttl">⚠️ 포트폴리오 리스크 경고</div>';
  if(risks.length===0){
    html+='<div style="text-align:center;padding:20px;color:var(--sub)">리스크 항목 없음 ✅</div>';
  }else{
    const lvlBg={high:'rgba(255,71,87,.1)',medium:'rgba(249,202,36,.1)',low:'rgba(78,205,196,.1)'};
    const lvlCol={high:'#ff4757',medium:'#f9ca24',low:'#4ecdc4'};
    risks.forEach(r=>{
      html+='<div style="background:'+lvlBg[r.level]+';border-left:3px solid '+lvlCol[r.level]+';border-radius:8px;padding:12px;margin-bottom:10px">';
      html+='<div style="display:flex;align-items:center;gap:8px;margin-bottom:5px"><span>'+r.icon+'</span><span style="font-size:13px;font-weight:700">'+r.title+'</span></div>';
      html+='<div style="font-size:12px;color:var(--sub)">'+r.desc+'</div></div>';
    });
  }
  html+='</div>';

  // 투자 전략 추천
  html+='<div class="sec"><div class="sec-ttl">💡 투자 전략 추천</div>';
  recs.forEach(rec=>{
    html+='<div style="background:var(--hdr);border-radius:10px;padding:14px;margin-bottom:10px">';
    html+='<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">';
    html+='<span style="font-size:13px;font-weight:700">'+rec.icon+' '+rec.title+'</span>';
    html+='<span style="padding:3px 8px;border-radius:10px;font-size:10px;font-weight:700;background:rgba(255,255,255,.1);color:'+rec.pColor+'">'+rec.priority+'</span>';
    html+='</div><div style="font-size:12px;color:var(--sub)">'+rec.desc+'</div></div>';
  });
  html+='</div>';

  // 섹터별 비중 분석
  html+='<div class="sec"><div class="sec-ttl">📊 섹터별 비중 분석</div>';
  html+='<table class="sector-table"><thead><tr><th>섹터</th><th>비중 바</th><th>비중</th><th>금액</th></tr></thead><tbody>';
  sectors.slice(0,12).forEach(s=>{
    const bw=Math.min(s.pct,100);
    html+='<tr><td style="padding:10px 8px;font-size:13px">'+s.cat+'</td>';
    html+='<td style="padding:10px 8px"><div style="height:8px;background:#2d3748;border-radius:4px;overflow:hidden"><div style="width:'+bw.toFixed(0)+'%;height:100%;background:var(--blu);border-radius:4px"></div></div></td>';
    html+='<td style="padding:10px 8px;font-size:13px;font-weight:700;text-align:right">'+s.pct.toFixed(1)+'%</td>';
    html+='<td style="padding:10px 8px;font-size:11px;color:var(--sub);text-align:right">'+fmtKRW(s.val)+'</td></tr>';
  });
  html+='</tbody></table></div>';

  // 매수 신호 체크리스트
  const buySignals=[
    ['섹터 조정 15% 이상',totalPct>15],
    ['거래량 평균 대비 3배 이상',false],
    ['RSI 30 이하 과매도',false],
    ['분기 실적 예상치 상회',totalPct>10],
    ['목표주가 현재가 대비 20% 이상 상승여력',totalPct>20]
  ];
  html+='<div class="sec"><div class="sec-ttl">✅ 매수 신호 체크리스트</div>';
  buySignals.forEach(([label,checked])=>{
    const icon=checked?'✅':'⬜';
    const style=checked?'color:var(--grn)':'color:var(--sub)';
    html+='<div style="padding:10px 0;border-bottom:1px solid var(--brd);font-size:13px;'+style+'">'+icon+' '+label+'</div>';
  });
  html+='</div>';

  // 매도 신호 체크리스트
  const sellSignals=[
    ['수익률 +30% 이상 달성',totalPct>30],
    ['펀더멘털 악화 (실적 하향 2분기 연속)',false],
    ['RSI 70 이상 과매수',false],
    ['섹터 전망 UNDERWEIGHT 전환',false],
    ['목표주가 달성',false]
  ];
  html+='<div class="sec"><div class="sec-ttl">🚨 매도 신호 체크리스트</div>';
  sellSignals.forEach(([label,checked])=>{
    const icon=checked?'✅':'⬜';
    const style=checked?'color:var(--grn)':'color:var(--sub)';
    html+='<div style="padding:10px 0;border-bottom:1px solid var(--brd);font-size:13px;'+style+'">'+icon+' '+label+'</div>';
  });
  html+='</div>';

  // 배당 포트폴리오
  html+='<div class="sec"><div class="sec-ttl">💰 배당 포트폴리오</div>';
  dividends.slice(0,12).forEach(d=>{
    html+='<div style="display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--brd)">';
    html+='<span style="font-size:13px">'+d.name+'</span>';
    html+='<div style="text-align:right"><div style="font-size:12px;color:#4ecdc4;font-weight:700">'+d.yield+'</div>';
    html+='<div style="font-size:10px;color:var(--sub)">'+d.month+'월 배당</div></div></div>';
  });
  html+='</div>';

  // 투자 5원칙
  html+='<div class="sec"><div class="sec-ttl">📌 투자 5원칙</div>';
  const principles=[
    ['01','분산 투자','단일 종목 10% 이상 비중 금지. 섹터별 20% 이상 금지.'],
    ['02','손절 원칙','-15% 도달 시 무조건 재검토. -25% 도달 시 강제 손절.'],
    ['03','분할 매수','한 번에 전액 투자 금지. 3회 이상 분할 매수 원칙.'],
    ['04','수익 실현','+30% 달성 시 절반 익실. 연간 목표 초과 시 리밸런싱.'],
    ['05','리뷰 사이클','주 1회 포트폴리오 리뷰. 월 1회 전략 재검토.']
  ];
  principles.forEach(([num,ttl,desc])=>{
    html+='<div class="principle"><div class="p-num">'+num+'</div><div class="p-ttl">'+ttl+'</div><div class="p-desc">'+desc+'</div></div>';
  });
  html+='</div>';

  document.getElementById('content').innerHTML=html;
}

loadAndRender().catch(e=>{
  document.getElementById('content').innerHTML='<div class="loading" style="color:var(--red)">데이터 로드 실패: '+e.message+'</div>';
});
</script>
</body>
</html>
