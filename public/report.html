body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans KR',sans-serif;background:var(--bg);color:var(--txt);font-size:14px;padding-bottom:80px;line-height:1.6;-webkit-font-smoothing:antialiased}

.logo{font-weight:800;font-size:17px;letter-spacing:-.3px}
.logo span{color:var(--blu);margin-right:6px}
.date-badge{padding:5px 14px;border-radius:20px;font-size:11px;font-weight:600;background:rgba(72,52,212,.12);color:var(--blu);border:1px solid rgba(72,52,212,.25)}
.nav-pills{display:flex;gap:6px;padding:10px 16px;overflow-x:auto;-webkit-overflow-scrolling:touch;background:var(--card);border-bottom:1px solid var(--brd)}
.nav-pills::-webkit-scrollbar{display:none}
.pill{padding:6px 14px;border-radius:20px;font-size:11px;font-weight:600;white-space:nowrap;background:var(--hdr);color:var(--sub);border:1px solid var(--brd);cursor:pointer;text-decoration:none;transition:all .2s}

.hero{background:linear-gradient(160deg,#12082e 0%,#0d1f3c 40%,#071a1a 100%);padding:28px 16px 24px;position:relative;overflow:hidden;animation:fadeUp .5s ease}
.hero::before{content:'';position:absolute;top:-50%;right:-30%;width:300px;height:300px;background:radial-gradient(circle,rgba(72,52,212,.15),transparent 70%);pointer-events:none}

.fab-refresh{position:fixed;bottom:78px;left:16px;width:48px;height:48px;border-radius:50%;background:linear-gradient(135deg,var(--blu),#686de0);color:#fff;border:none;font-size:20px;cursor:pointer;z-index:1000;box-shadow:0 4px 14px rgba(72,52,212,.4);display:flex;align-items:center;justify-content:center;transition:transform .2s;-webkit-tap-highlight-color:transparent}

<script>
function toggleSec(el){el.parentElement.classList.toggle('open')}

// ── CSV Parser ──
function parseCSV(text) {
  const lines = text.trim().split('\n');
  const headers = lines[0].split(',');
  return lines.slice(1).map(line => {
    const vals = []; let cur = ''; let inQ = false;
    for (let i = 0; i < line.length; i++) {
      const c = line[i];
      if (c === '"') { inQ = !inQ; continue; }
      if (c === ',' && !inQ) { vals.push(cur.trim()); cur = ''; continue; }
      cur += c;
    }
    vals.push(cur.trim());
    const obj = {};
    headers.forEach((h, i) => obj[h.trim()] = vals[i] || '');
    return obj;
  });
}

function parseMoney(s) {
  if (!s || s === '-') return { val: 0, usd: false };
  const usd = s.includes('$');
  const n = parseFloat(s.replace(/[₩$,+\s]/g, ''));
  return { val: isNaN(n) ? 0 : Math.abs(n), usd };
}

function parsePnlPct(s) {
  if (!s || s === '-') return 0;
  const m = s.match(/([+-]?\d+\.?\d*)%/);
  return m ? parseFloat(m[1]) : 0;
}

function fmtBillion(n) {
  if (n >= 1e8) return '₩' + (n / 1e8).toFixed(1) + '억';
  if (n >= 1e4) return '₩' + (n / 1e4).toFixed(0) + '만';
  return '₩' + Math.round(n).toLocaleString();
}

function fmtPct(n) { return (n >= 0 ? '+' : '') + n.toFixed(1) + '%'; }

const SECTOR_COLORS = {
  '첨단 기술': 'var(--blu)', '경기 소비재': 'var(--yel)', 'ETF': '#886de0',
  '가상자산': '#a55eea', '부동산': '#00b894', '채권': '#0984e3',
  '헬스케어': '#e84393', '산업재': 'var(--grn)', '금융': '#f0932b',
  'IT': '#4834d4', '소재': '#6c5ce7', '유틸리티': '#00cec9', '기타': '#636e72'
};

async function loadReport() {
  try {
    // Load wisereport data and portfolio in parallel
    const [wrRes, csvRes, mktRes] = await Promise.all([
      fetch('data/wisereport_latest.json'),
      fetch('portfolio_full.csv'),
      fetch('data/market_latest.json').catch(() => null)
    ]);

    const wr = wrRes.ok ? await wrRes.json() : { top_picks: [], portfolio_reports: [], key_reports: [] };
    const csvText = await csvRes.text();
    const rows = parseCSV(csvText);

    let usdkrw = 1450;
    if (mktRes && mktRes.ok) {
      try {
        const mkt = await mktRes.json();
        const fx = mkt.data && mkt.data.find(d => d.id === 'USDKRW');
        if (fx && fx.cur > 0) usdkrw = fx.cur;
      } catch(e) {}
    }

    // ── Parse Portfolio ──
    const portfolio = {};
    const sectorMap = {};
    let totalAssets = 0;
    const bigWinners = [];
    const losers = [];

    rows.forEach(row => {
      const name = row['자산'] || '';
      const sector = row['분류'] || '기타';
      const assetVal = parseMoney(row['자산가치']);
      const costPer = parseMoney(row['매수가']);
      const qty = parseFloat(row['수량']) || 0;
      const pnlPct = parsePnlPct(row['손익']);
      let valKRW = assetVal.usd ? assetVal.val * usdkrw : assetVal.val;

      if (sector !== '현금') {
        totalAssets += valKRW;
      }
      sectorMap[sector] = (sectorMap[sector] || { val: 0, items: [] });
      sectorMap[sector].val += valKRW;
      sectorMap[sector].items.push({ name, valKRW, pnlPct, costPer: costPer.val, qty });

      portfolio[name] = { sector, valKRW, pnlPct, costPer: costPer.val, qty, usd: assetVal.usd, assetVal: assetVal.val };

      if (pnlPct > 30) bigWinners.push({ name, pct: pnlPct, sector, valKRW });
      if (pnlPct < -10) losers.push({ name, pct: pnlPct, sector, valKRW });
    });

    // ── Date ──
    const today = new Date();
    const dateStr = `${today.getFullYear()}.${String(today.getMonth()+1).padStart(2,'0')}.${String(today.getDate()).padStart(2,'0')}`;
    document.getElementById('dateLabel').textContent = dateStr;

    const wrDate = wr.date || dateStr;

    // ── Top Picks ──
    const picks = wr.top_picks || [];
    const typeClass = { Top: 'top', Hot: 'hot', Best: 'best' };
    let picksHtml = '';
    if (picks.length > 0) {
      picksHtml += '<div class="pick-grid">';
      picks.forEach(p => {
        const cls = typeClass[p.type] || 'best';
        picksHtml += `<div class="pick ${cls}">
          <div class="pick-label">${(p.type || '').toUpperCase()}</div>
          <div class="pick-name">${p.company}</div>
          <div class="pick-info">${p.opinion || ''} · 목표 ${p.target || '—'}<br>${p.broker || ''}</div>
        </div>`;
      });
      picksHtml += '</div>';
    }

    // Highlight for picks
    if (picks.length > 0) {
      const firstPick = picks[0];
      picksHtml += `<div class="highlight">
        <div class="hl-title">오늘의 핵심 포인트</div>
        <div class="hl-body"><strong>${firstPick.company}</strong>이(가) ${firstPick.type} Pick으로 선정되었습니다. "${firstPick.title}" — ${firstPick.broker || ''}.</div>
      </div>`;
    }
    document.getElementById('picksBody').innerHTML = picksHtml || '<div class="loading">추천 데이터 없음</div>';

    // ── Reports ──
    const allReports = [];
    // Portfolio reports (보유 종목 관련)
    (wr.portfolio_reports || []).forEach(r => {
      const held = portfolio[r.company];
      allReports.push({ ...r, is_mine: true, held });
    });
    // Key reports
    (wr.key_reports || []).forEach(r => {
      const held = portfolio[r.company];
      allReports.push({ ...r, is_mine: !!held, held: held || null });
    });

    const buyCount = allReports.filter(r => {
      const op = (r.opinion || '').toLowerCase();
      return op.includes('buy') || op.includes('매수');
    }).length;

    document.getElementById('reportsCnt').textContent = allReports.length + '건';
    document.getElementById('smcReports').textContent = allReports.length + picks.length;
    document.getElementById('smcBuy').textContent = buyCount;

    let reportsHtml = '';
    allReports.forEach(r => {
      const op = (r.opinion || '').toLowerCase();
      const isBuy = op.includes('buy') || op.includes('매수');
      const cardCls = isBuy ? 'buy' : '';
      const opCls = isBuy ? 'buy-op' : 'hold-op';

      let pricesHtml = '';
      if (r.target) pricesHtml += `<span class="target">목표 ₩${r.target}</span>`;
      if (r.current_price) pricesHtml += `<span class="current">현재 ₩${r.current_price.toLocaleString()}</span>`;

      let upsideHtml = '';
      if (r.upside) {
        const isPos = r.upside.startsWith('+');
        upsideHtml = `<div class="rpt-upside ${isPos ? 'pos' : 'neg'}">${r.upside} 상승여력</div>`;
      }

      // If held, show portfolio info
      let heldInfo = '';
      if (r.held) {
        const h = r.held;
        const pnlCls = h.pnlPct >= 0 ? 'pos' : 'neg';
        heldInfo = `<div style="margin-top:8px;padding:8px 10px;background:rgba(240,147,43,.06);border-radius:8px;border:1px solid rgba(240,147,43,.1);font-size:11px;color:var(--sub)">
          📦 보유 중 · ${fmtPct(h.pnlPct)} · ${fmtBillion(h.valKRW)}
        </div>`;
      }

      const myBadge = r.is_mine ? ' <span class="my-badge">보유종목</span>' : '';

      reportsHtml += `<div class="rpt-card ${cardCls}">
        <div class="rpt-header">
          <div class="rpt-name">${r.company}${myBadge}</div>
          <div class="rpt-opinion ${opCls}">${r.opinion || '—'}</div>
        </div>
        <div class="rpt-meta"><span class="analyst">${r.broker || ''}</span></div>
        <div class="rpt-title">"${r.title}"</div>
        ${pricesHtml ? `<div class="rpt-prices">${pricesHtml}</div>` : ''}
        ${upsideHtml}
        ${r.summary ? `<div class="rpt-analysis">${r.summary}</div>` : ''}
        ${heldInfo}
      </div>`;
    });

    // Add portfolio holdings with big gains/losses that don't have reports
    const reportedCompanies = new Set(allReports.map(r => r.company));
    const notableHoldings = [...bigWinners, ...losers]
      .filter(h => !reportedCompanies.has(h.name) && h.name in portfolio && portfolio[h.name].sector !== '현금')
      .slice(0, 5);

    if (notableHoldings.length > 0) {
      reportsHtml += `<div style="display:flex;align-items:center;gap:8px;margin:18px 0 14px;padding-bottom:8px;border-bottom:1px solid var(--brd)">
        <span style="font-size:16px">📦</span>
        <span style="font-size:13px;font-weight:700;color:var(--yel)">보유 종목 현황</span>
        <span style="font-size:10px;color:var(--sub);margin-left:auto;background:rgba(139,157,195,.08);padding:2px 8px;border-radius:8px">${notableHoldings.length}건</span>
      </div>`;

      notableHoldings.forEach(h => {
        const p = portfolio[h.name];
        const pnlCls = h.pct >= 0 ? 'pos' : 'neg';
        const note = h.pct > 100 ? '수익 실현 일부 검토' : h.pct > 30 ? '모니터링 유지' : h.pct < -20 ? '손절 기준 재검토' : '관망 유지';
        reportsHtml += `<div class="rpt-card ${h.pct >= 0 ? 'buy' : 'hold'}">
          <div class="rpt-header">
            <div class="rpt-name">${h.name} <span class="my-badge">보유종목</span></div>
            <div class="rpt-opinion ${h.pct >= 0 ? 'buy-op' : 'hold-op'}">${fmtPct(h.pct)}</div>
          </div>
          <div class="rpt-meta"><span class="analyst">${p.sector} · ${fmtBillion(p.valKRW)}</span></div>
          <div class="rpt-upside ${pnlCls}">${fmtPct(h.pct)} ${h.pct >= 0 ? '수익' : '손실'} 중</div>
          <div class="rpt-analysis"><strong>${note}</strong></div>
        </div>`;
      });
    }

    document.getElementById('reportsBody').innerHTML = reportsHtml || '<div class="loading">리포트 데이터 없음</div>';

    // ── Sector Analysis ──
    const sectors = Object.entries(sectorMap)
      .filter(([s]) => s !== '현금')
      .sort((a, b) => b[1].val - a[1].val);
    const maxSectorVal = sectors[0] ? sectors[0][1].val : 1;

    document.getElementById('sectorCnt').textContent = sectors.length + '개 섹터';
    document.getElementById('smcSectors').textContent = sectors.length;

    let sectorHtml = '';
    sectors.forEach(([name, data]) => {
      const pct = (data.val / totalAssets * 100).toFixed(1);
      const barW = Math.max(5, (data.val / maxSectorVal * 100));
      const color = SECTOR_COLORS[name] || '#636e72';
      const topItems = data.items.sort((a, b) => b.valKRW - a.valKRW).slice(0, 5);
      const holdingCount = data.items.length;

      sectorHtml += `<div class="sector-card">
        <div class="sector-header">
          <div class="sector-name">${name}</div>
          <div class="sector-count">${holdingCount}종목 · ${pct}%</div>
        </div>
        <div class="sector-bar"><div class="sector-fill" style="width:${barW.toFixed(0)}%;background:linear-gradient(90deg,${color},transparent)"></div></div>
        <div class="sector-desc"><strong>${fmtBillion(data.val)}</strong> 투자 · 포트폴리오 비중 <strong>${pct}%</strong></div>
        <div class="sector-stocks">${topItems.map(i => {
          const pnlColor = i.pnlPct >= 0 ? 'var(--red)' : 'var(--grn)';
          return `<span class="sector-tag">${i.name} <span style="color:${pnlColor};font-size:10px">${fmtPct(i.pnlPct)}</span></span>`;
        }).join('')}</div>
      </div>`;
    });

    document.getElementById('sectorBody').innerHTML = sectorHtml || '<div class="loading">섹터 데이터 없음</div>';

    // ── Strategy ──
    const totalPnL = Object.values(portfolio).reduce((s, p) => s + p.valKRW, 0) - rows.reduce((s, r) => {
      const c = parseMoney(r['매수가']);
      const q = parseFloat(r['수량']) || 0;
      return s + (c.val > 0 ? (c.usd ? c.val * usdkrw * q : c.val * q) : 0);
    }, 0);
    const totalCost = totalAssets - totalPnL;
    const totalPnLPct = totalCost > 0 ? (totalPnL / totalCost * 100) : 0;
    const cryptoPct = ((sectorMap['가상자산'] || {val:0}).val / totalAssets * 100);
    const defensivePct = (((sectorMap['채권'] || {val:0}).val + (sectorMap['부동산'] || {val:0}).val) / totalAssets * 100);

    let stratHtml = '';

    // Overall judgment
    stratHtml += `<div class="highlight">
      <div class="hl-title">종합 판단</div>
      <div class="hl-body">포트폴리오 총 <strong>${fmtBillion(totalAssets)}</strong> · 수익률 <strong>${fmtPct(totalPnLPct)}</strong>.
      ${bigWinners.length}개 종목이 +30% 이상 수익, ${losers.length}개 종목이 -10% 이상 손실 중.
      ${wr.top_picks && wr.top_picks.length > 0 ? `WiseReport ${wrDate} 기준 추천 종목: <strong>${wr.top_picks.map(p => p.company).join(', ')}</strong>.` : ''}</div>
    </div>`;

    let stratNum = 1;

    // Big winners management
    if (bigWinners.length > 0) {
      const top3 = bigWinners.sort((a, b) => b.pct - a.pct).slice(0, 3);
      stratHtml += `<div class="strat-card"><div class="strat-num">${String(stratNum).padStart(2,'0')}</div>
        <div class="strat-title">고수익 종목 이익 실현 검토</div>
        <div class="strat-body">${top3.map(w => `<strong>${w.name}</strong> ${fmtPct(w.pct)}`).join(', ')} 등 수익률 +30% 초과 종목이 ${bigWinners.length}개. 일부 이익 실현으로 리스크 관리 권장.</div>
        <div class="strat-stocks">${top3.map(w => `<span class="strat-tag pos">${w.name} ${fmtPct(w.pct)}</span>`).join('')}</div>
      </div>`;
      stratNum++;
    }

    // Losers management
    if (losers.length > 0) {
      const worst = losers.sort((a, b) => a.pct - b.pct).slice(0, 3);
      const borderCls = worst[0].pct < -25 ? 'danger' : 'caution';
      stratHtml += `<div class="strat-card ${borderCls}"><div class="strat-num">${String(stratNum).padStart(2,'0')}</div>
        <div class="strat-title">손실 종목 관리</div>
        <div class="strat-body">${worst.map(l => `<strong>${l.name}</strong> ${fmtPct(l.pct)}`).join(', ')} — -25% 도달 시 강제 손절 원칙 적용. 개별 종목 펀더멘털 재점검 필요.</div>
        <div class="strat-stocks">${worst.map(l => `<span class="strat-tag neg">${l.name} ${fmtPct(l.pct)}</span>`).join('')}</div>
      </div>`;
      stratNum++;
    }

    // Sector rebalancing
    if (cryptoPct > 15 || defensivePct < 10) {
      stratHtml += `<div class="strat-card caution"><div class="strat-num">${String(stratNum).padStart(2,'0')}</div>
        <div class="strat-title">섹터 리밸런싱</div>
        <div class="strat-body">${cryptoPct > 15 ? `가상자산 비중 <strong>${cryptoPct.toFixed(1)}%</strong> — 15% 이하로 축소 권장. ` : ''}${defensivePct < 10 ? `채권/리츠 비중 <strong>${defensivePct.toFixed(1)}%</strong> — 방어적 자산 확대 검토.` : ''}</div>
        <div class="strat-stocks">${cryptoPct > 15 ? '<span class="strat-tag neg">가상자산 축소</span>' : ''}${defensivePct < 10 ? '<span class="strat-tag neu">채권/리츠 확대</span>' : ''}</div>
      </div>`;
      stratNum++;
    }

    // Goal-based
    if (totalPnLPct >= 15) {
      stratHtml += `<div class="strat-card"><div class="strat-num">${String(stratNum).padStart(2,'0')}</div>
        <div class="strat-title">연간 목표 초과 달성</div>
        <div class="strat-body">수익률 <strong>${fmtPct(totalPnLPct)}</strong>로 연간 목표(+15%) 초과 달성. 수익의 10~15%를 현금화하여 리밸런싱 권장. 실현 현금은 배당주·채권으로 재배치.</div>
        <div class="strat-stocks"><span class="strat-tag pos">일부 수익 실현</span><span class="strat-tag neu">배당주 재투자</span></div>
      </div>`;
      stratNum++;
    }

    // Portfolio reports strategy
    const prReports = wr.portfolio_reports || [];
    if (prReports.length > 0) {
      prReports.forEach(pr => {
        stratHtml += `<div class="strat-card"><div class="strat-num">${String(stratNum).padStart(2,'0')}</div>
          <div class="strat-title">${pr.company} — 애널리스트 커버리지</div>
          <div class="strat-body"><strong>${pr.broker}</strong> "${pr.title}" · 목표가 ₩${pr.target}${pr.upside ? ` (${pr.upside})` : ''}. ${pr.summary || ''}</div>
          <div class="strat-stocks"><span class="strat-tag pos">${pr.company} ${pr.opinion || ''}</span></div>
        </div>`;
        stratNum++;
      });
    }

    document.getElementById('strategyBody').innerHTML = stratHtml || '<div class="loading">전략 데이터 없음</div>';

    // ── Hero Summary ──
    const topSectors = sectors.slice(0, 3).map(([n]) => n);
    const heroKws = [];
    if (wr.top_picks) wr.top_picks.forEach(p => heroKws.push(p.company));
    topSectors.forEach(s => heroKws.push(s));

    document.getElementById('heroText').innerHTML =
      `포트폴리오 <strong>${rows.length}개 자산</strong> · <strong>${fmtBillion(totalAssets)}</strong> · 수익률 <strong style="color:${totalPnLPct >= 0 ? 'var(--red)' : 'var(--grn)'}">${fmtPct(totalPnLPct)}</strong>. ` +
      `${allReports.length > 0 ? `WiseReport 기준 <strong>${allReports.length}건</strong> 리포트 분석 완료.` : ''} ` +
      `${bigWinners.length > 0 ? `<strong>${bigWinners.length}개</strong> 종목 +30% 이상 수익 중.` : ''}`;

    document.getElementById('heroKeywords').innerHTML = heroKws.slice(0, 6).map(k =>
      `<span class="kw">${k}</span>`
    ).join('');

    // ── Disclaimer date ──
    document.getElementById('disclaimer').innerHTML =
      `본 리포트는 WiseReport 데이터를 종합 분석한 것으로 투자 권유가 아닙니다.<br>
      투자 결정은 본인의 판단하에 이루어져야 합니다. | 데이터 기준: ${dateStr} · WiseReport ${wrDate}<br>
      Generated by Investment Command AI`;

  } catch(e) {
    console.error('Report load error:', e);
    document.getElementById('heroText').textContent = '❌ 데이터 로딩 실패: ' + e.message;
  }
}

// ── Nav pill scrolling ──
document.querySelectorAll('.pill').forEach(pill => {
  pill.addEventListener('click', function(e) {
    e.preventDefault();
    const target = document.querySelector(this.getAttribute('href'));
    if (target) {
      const sec = target.closest('.sec') || target;
      if (sec.classList.contains('sec') && !sec.classList.contains('open')) sec.classList.add('open');
      target.scrollIntoView({ behavior: 'smooth', block: 'start' });
      document.querySelectorAll('.pill').forEach(p => p.classList.remove('active'));
      this.classList.add('active');
    }
  });
});

const sections = document.querySelectorAll('.sec[id],.hero[id]');
const pills = document.querySelectorAll('.pill');
const secObserver = new IntersectionObserver((entries) => {
  entries.forEach(entry => {
    if (entry.isIntersecting) {
      const id = '#' + entry.target.id;
      pills.forEach(p => { p.classList.toggle('active', p.getAttribute('href') === id) });
    }
  });
}, { threshold: 0.3, rootMargin: '-60px 0px -60% 0px' });
sections.forEach(s => secObserver.observe(s));

loadReport();
</script>
<button class="fab-refresh" id="refreshBtn" onclick="doRefresh()" title="전체 새로고침"><span class="fab-icon">↻</span></button>
<script>function doRefresh(){document.getElementById('refreshBtn').classList.add('spin');setTimeout(()=>location.reload(),300)}</script>
</body>
</html>
