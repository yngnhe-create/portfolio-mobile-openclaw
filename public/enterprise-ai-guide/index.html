            <div style={{ fontSize: 13, fontWeight: 700, color: "#fb923c", marginBottom: 12 }}>⚠️ 멀티LLM 도입 시 추가로 생기는 보안 위험</div>
            {[
              { risk: "API 키 중앙 집중", detail: "여러 LLM 공급사의 API 키가 플랫폼 한 곳에 모임 → 플랫폼이 해킹되면 모든 API 키 노출 위험", level: "높음", color: "#ef4444" },
              { risk: "데이터 경유 지점 증가", detail: "사용자 → 멀티LLM 플랫폼 → 각 LLM API → 응답 반환. 플랫폼 자체가 데이터 경유 포인트가 됨", level: "중간", color: "#f59e0b" },
              { risk: "라우팅 로그의 민감정보", detail: "어떤 질문이 어떤 모델로 갔는지 로그에 기록 → 로그에 기밀 정보 포함될 수 있음", level: "중간", color: "#f59e0b" },
              { risk: "자체 개발 시 보안 취약점", detail: "직접 개발한 플랫폼에 보안 취약점이 있을 경우 전체 AI 시스템이 위험해짐", level: "높음", color: "#ef4444" },
            ].map(r => (
              <div key={r.risk} style={{ display: "flex", gap: 10, alignItems: "flex-start", marginBottom: 10 }}>
                <span style={{ background: r.color + "20", color: r.color, borderRadius: 6, padding: "2px 8px", fontSize: 10, fontWeight: 700, whiteSpace: "nowrap", flexShrink: 0, marginTop: 1 }}>위험 {r.level}</span>
                <div>
                  <div style={{ fontSize: 12, fontWeight: 700, color: "#e2e8f0" }}>{r.risk}</div>
                  <div style={{ fontSize: 11, color: "#94a3b8", marginTop: 2, lineHeight: 1.6 }}>{r.detail}</div>
                </div>
              </div>
            ))}
          </div>

          <div style={{ background: "#0f1f0f", border: "1px solid #10b98130", borderRadius: 14, padding: 18 }}>
            <div style={{ fontSize: 13, fontWeight: 700, color: "#10b981", marginBottom: 12 }}>✅ 멀티LLM 보안 필수 조치</div>
            {[
              { action: "API 키 암호화 저장", detail: "각 LLM 공급사 API 키를 평문이 아닌 HSM 또는 KMS(키 관리 서비스)로 암호화 보관" },
              { action: "프롬프트 민감정보 마스킹", detail: "플랫폼 통과 전 개인정보(주민번호·계좌번호)·기밀정보 자동 탐지 및 마스킹 처리" },
              { action: "역할 기반 모델 접근 제어", detail: "직원 등급에 따라 사용 가능한 LLM 제한. 예: 일반직원은 온프레미스 모델만, 임원은 GPT-4도 가능" },
              { action: "로그 암호화 및 접근 제한", detail: "감사 로그에 포함될 수 있는 민감정보 암호화. 로그 조회 권한 최소화" },
              { action: "네트워크 격리", detail: "멀티LLM 플랫폼을 사내 DMZ 또는 별도 보안 구역에 배치. 외부 인터넷 직접 접근 차단" },
              { action: "공급사별 Zero Data Retention", detail: "각 LLM API 계약 시 ZDR 옵션 설정. 데이터가 공급사 서버에 남지 않도록 계약 조항 명시" },
            ].map(item => (
              <div key={item.action} style={{ display: "flex", gap: 8, alignItems: "flex-start", marginBottom: 8 }}>
                <span style={{ color: "#10b981", fontSize: 12, flexShrink: 0, marginTop: 2 }}>☑</span>
                <div>
                  <div style={{ fontSize: 12, fontWeight: 700, color: "#e2e8f0" }}>{item.action}</div>
                  <div style={{ fontSize: 11, color: "#64748b", marginTop: 2, lineHeight: 1.5 }}>{item.detail}</div>
                </div>
              </div>
            ))}
          </div>
        </div>
      )}

      {/* 자체 개발 vs SaaS */}
      {activeSection === "proprietary" && (
        <div>
          <div style={{ fontSize: 12, color: "#64748b", lineHeight: 1.7, marginBottom: 16 }}>
            멀티LLM 플랫폼을 직접 만들지(자체 개발), 아니면 기성 SaaS 제품을 쓸지는 기업의 규모·보안 요건·기술력에 따라 달라집니다.
          </div>
          <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 12, marginBottom: 16 }}>
            {[
              {
                title: "🏢 자체 개발",
                subtitle: "(예: Brixa 같은 솔루션)",
                color: "#6366f1",
                pros: ["보안 정책 100% 커스터마이징", "사내 시스템 완전 통합", "SaaS 구독료 없음", "데이터가 자사 통제 하에만 존재", "규정 요건 즉시 대응"],
                cons: ["개발·유지보수 인력 필요", "보안 취약점 직접 책임", "신규 모델 연동 직접 개발", "초기 구축 시간 3~12개월"],
                best: "IT 인력 보유 + 높은 보안 요건 + 장기적 AI 내재화 목표",
              },
              {
                title: "☁️ SaaS 플랫폼",
                subtitle: "(Dify, PortKey, Helicone 등)",
                color: "#3b82f6",
                pros: ["즉시 사용 가능 (수 시간)", "보안·업데이트 공급사가 관리", "새 모델 자동 추가", "저렴한 초기 비용"],
                cons: ["SaaS 공급사에 데이터 경유", "커스터마이징 한계", "월 구독료 누적", "공급사 정책 변경에 종속"],
                best: "빠른 도입 필요 + IT 인력 부족 + 중소기업",
              },
            ].map(card => (
              <div key={card.title} style={{ background: card.color + "0a", border: `2px solid ${card.color}30`, borderRadius: 14, padding: 18 }}>
                <div style={{ fontSize: 14, fontWeight: 800, color: card.color }}>{card.title}</div>
                <div style={{ fontSize: 11, color: "#64748b", marginBottom: 14 }}>{card.subtitle}</div>
                <div style={{ marginBottom: 10 }}>
                  <div style={{ fontSize: 11, fontWeight: 700, color: "#10b981", marginBottom: 5 }}>✅ 장점</div>
                  {card.pros.map(p => <div key={p} style={{ fontSize: 11, color: "#94a3b8", marginBottom: 3, lineHeight: 1.5 }}>• {p}</div>)}
                </div>
                <div style={{ marginBottom: 10 }}>
                  <div style={{ fontSize: 11, fontWeight: 700, color: "#ef4444", marginBottom: 5 }}>⚠️ 단점</div>
                  {card.cons.map(p => <div key={p} style={{ fontSize: 11, color: "#94a3b8", marginBottom: 3, lineHeight: 1.5 }}>• {p}</div>)}
                </div>
                <div style={{ background: card.color + "15", borderRadius: 8, padding: "8px 10px" }}>
                  <div style={{ fontSize: 10, color: card.color, fontWeight: 700 }}>🎯 추천 대상</div>
                  <div style={{ fontSize: 11, color: "#94a3b8", marginTop: 3, lineHeight: 1.5 }}>{card.best}</div>
                </div>
              </div>
            ))}
          </div>

          {/* 의사결정 트리 */}
          <div style={{ background: "#0d1117", border: "1px solid #1e2433", borderRadius: 12, padding: 18 }}>
            <div style={{ fontSize: 13, fontWeight: 700, color: "#e2e8f0", marginBottom: 14 }}>🌳 자체 개발 vs SaaS 선택 가이드</div>
            {[
              { q: "보안 요건이 매우 높고 데이터 외부 유출이 절대 안 됨", ans: "→ 자체 개발 필수", color: "#6366f1" },
              { q: "IT 개발 인력이 충분하고 장기 운영 가능", ans: "→ 자체 개발 유리", color: "#6366f1" },
              { q: "6개월 내 빠른 도입이 목표", ans: "→ SaaS 우선 검토", color: "#3b82f6" },
              { q: "중소기업으로 IT 전담팀이 없음", ans: "→ SaaS 적합", color: "#3b82f6" },
              { q: "보안 중요하지만 IT 인력 부족 → 중간 절충안", ans: "→ 오픈소스(LiteLLM) + 사내 인프라 설치", color: "#10b981" },
            ].map(item => (
              <div key={item.q} style={{ display: "flex", gap: 10, alignItems: "flex-start", marginBottom: 10, background: item.color + "08", borderRadius: 8, padding: "8px 12px" }}>
                <span style={{ fontSize: 11, color: "#64748b", flex: 1, lineHeight: 1.6 }}>Q. {item.q}</span>
                <span style={{ fontSize: 11, fontWeight: 700, color: item.color, whiteSpace: "nowrap" }}>{item.ans}</span>
              </div>
            ))}
          </div>
        </div>
      )}
    </div>
  );
};

function App() {
  const [activeCase, setActiveCase] = useState("A");
  const [activeTab, setActiveTab] = useState("overview");
  const tabs = [
    { id: "overview", label: "📊 전체 구조" },
    { id: "cases", label: "🔍 케이스 상세" },
    { id: "delivery", label: "📡 제공 방식" },
    { id: "compare", label: "⚖️ 비교표" },
    { id: "models", label: "🚀 모델 성능" },
    { id: "multillm", label: "🔀 멀티LLM" },
    { id: "summary", label: "📋 1장 요약" },
  ];
  return (
    <div style={{ background: "#060a14", minHeight: "100vh", fontFamily: "'Pretendard','Apple SD Gothic Neo','Noto Sans KR',sans-serif", color: "#e2e8f0", paddingBottom: 60 }}>
      <div style={{ background: "linear-gradient(135deg,#0d1b2a 0%,#080d18 100%)", borderBottom: "1px solid #1e2433", padding: "24px 20px 20px", position: "relative", overflow: "hidden" }}>
        <div style={{ position: "absolute", inset: 0, backgroundImage: "radial-gradient(circle at 80% 50%,#3b82f618 0%,transparent 60%)", pointerEvents: "none" }} />
        <div style={{ position: "relative", maxWidth: 780, margin: "0 auto" }}>
          <div style={{ fontSize: 10, color: "#3b82f6", fontWeight: 700, letterSpacing: 2, marginBottom: 5 }}>ENTERPRISE AI SECURITY GUIDE</div>
          <h1 style={{ margin: 0, fontSize: 20, fontWeight: 900, color: "#f1f5f9" }}>기업 AI 도입 완전 가이드</h1>
          <p style={{ margin: "6px 0 0", color: "#64748b", fontSize: 11 }}>6가지 케이스 · LLM 모델 비교 · 보안 분석 · 제공 방식 시각화</p>
        </div>
      </div>
      <div style={{ borderBottom: "1px solid #1e2433", background: "#0a0f1e", position: "sticky", top: 0, zIndex: 10, overflowX: "auto" }}>
        <div style={{ maxWidth: 780, margin: "0 auto", display: "flex", minWidth: 480 }}>
          {tabs.map(tab => (
            <button key={tab.id} onClick={() => setActiveTab(tab.id)} style={{ background: "transparent", border: "none", borderBottom: `2px solid ${activeTab === tab.id ? "#3b82f6" : "transparent"}`, color: activeTab === tab.id ? "#3b82f6" : "#64748b", padding: "11px 13px", cursor: "pointer", fontSize: 11, fontWeight: activeTab === tab.id ? 700 : 400, transition: "all 0.2s", fontFamily: "inherit", whiteSpace: "nowrap" }}>
              {tab.label}
            </button>
          ))}
        </div>
      </div>
      <div style={{ maxWidth: 780, margin: "0 auto", padding: "20px 14px" }}>
        {activeTab === "overview" && <OverviewTab />}
        {activeTab === "cases" && (
          <div>
            <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 6, marginBottom: 16 }}>
              {CASES.map(c => <CaseCard key={c.id} c={c} isSelected={activeCase === c.id} onClick={() => setActiveCase(c.id)} />)}
            </div>
            <DetailPanel c={CASES.find(c => c.id === activeCase)} />
          </div>
        )}
        {activeTab === "delivery" && <DeliveryTab />}
        {activeTab === "compare" && <CompareTab />}
        {activeTab === "models" && <ModelsTab />}
        {activeTab === "multillm" && <MultiLLMTab />}
        {activeTab === "summary" && <SummaryTab />}
      </div>
    </div>
  );
}


const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
  </script>
</body>
