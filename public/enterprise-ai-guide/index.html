        <div style={{ maxWidth: 780, margin: "0 auto", display: "flex", minWidth: 480 }}>
          {tabs.map(tab => (
            <button key={tab.id} onClick={() => setActiveTab(tab.id)} style={{ background: "transparent", border: "none", borderBottom: `2px solid ${activeTab === tab.id ? "#3b82f6" : "transparent"}`, color: activeTab === tab.id ? "#3b82f6" : "#64748b", padding: "11px 13px", cursor: "pointer", fontSize: 11, fontWeight: activeTab === tab.id ? 700 : 400, transition: "all 0.2s", fontFamily: "inherit", whiteSpace: "nowrap" }}>
              {tab.label}
            </button>
          ))}
        </div>
      </div>
      <div style={{ maxWidth: 780, margin: "0 auto", padding: "20px 14px" }}>
        {activeTab === "overview" && <OverviewTab />}
        {activeTab === "cases" && (
          <div>
            <div style={{ fontSize: 16, fontWeight: 800, color: "#e2e8f0", marginBottom: 12 }}>케이스 상세 보기</div>
            <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 6, marginBottom: 16 }}>
              {CASES.map(c => <CaseCard key={c.id} c={c} isSelected={activeCase === c.id} onClick={() => setActiveCase(c.id)} />)}
            </div>
            <DetailPanel c={CASES.find(c => c.id === activeCase)} />
          </div>
        )}
        {activeTab === "delivery" && <DeliveryTab />}
        {activeTab === "compare" && <CompareTab />}
        {activeTab === "models" && <ModelsTab />}
        {activeTab === "multillm" && <MultiLLMTab />}
        {activeTab === "summary" && <SummaryTab />}
      </div>
    </div>
  );
}


const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
  </script>
</body>
</html>
